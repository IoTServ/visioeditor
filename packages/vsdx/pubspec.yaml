name: vsdx
description: "Pure-Dart Microsoft Visio (.vsdx / OPC) engine: read, editable model, and round-trip writer. No Flutter dependency."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  archive: ^3.6.1
  xml: ^6.5.0
  path: ^1.9.0
  vector_math: ^2.1.4
  meta: ^1.15.0
  collection: ^1.18.0
  crypto: ^3.0.5
  logging: ^1.2.0
  # Legacy VSD5/VSD6 FontIX code pages (Windows-125x, CJK, Symbol).
  charset: ^2.0.1
  cp949_codec: ^1.0.2
  enough_convert: ^1.6.0
  # Multi-command CLI (bin/vsdxtool.dart) — the headless Agent backend.
  args: ^2.5.0
  # Parse YAML OpenAPI/Swagger specs (import-openapi); JSON handled by dart:convert.
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  ffi: ^2.1.0
