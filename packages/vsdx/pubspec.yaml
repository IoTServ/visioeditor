name: vsdx
description: "Pure-Dart Microsoft Visio (.vsdx / OPC) engine: read, editable model, and round-trip writer. No Flutter dependency."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  archive: ^3.6.1
  xml: ^6.5.0
  path: ^1.9.0
  vector_math: ^2.1.4
  meta: ^1.15.0
  collection: ^1.18.0
  crypto: ^3.0.5
  logging: ^1.2.0
  # Multi-command CLI (bin/vsdxtool.dart) — the headless Agent backend.
  args: ^2.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  ffi: ^2.1.0
