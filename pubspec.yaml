name: visioeditor
description: "Editor for Visio Diagrams — a native, cross-platform Microsoft Visio (.vsdx) editor."
publish_to: 'none'
version: 1.0.1+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Pure-Dart .vsdx engine (model / parser / writer). Local package.
  vsdx:
    path: packages/vsdx

  # Rendering (model -> Flutter Path/Canvas).
  path_drawing: ^1.0.1
  vector_math: ^2.1.4

  # IO / files.
  file_picker: ^8.1.4
  desktop_drop: ^0.7.1
  shared_preferences: ^2.5.3

  # Misc.
  intl: ^0.20.2
  url_launcher: ^6.3.2
  collection: ^1.18.0
  logging: ^1.2.0
  meta: ^1.15.0
  pdf: ^3.12.0
  flutter_lucide: ^1.11.0
  # Compatible with Flutter 3.44+ (IconData is final; phosphor_flutter is not).
  phosphoricons_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  mocktail: ^1.0.4
  # Used by tool/gen_app_icon.dart to render branded app icons for every
  # platform (macOS / Android / iOS / Web / Windows / Linux).
  image: ^4.3.0
  archive: ^3.6.1
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
    - assets/materials/

# Microsoft Store (Windows) packaging — Product identity from Partner Center.
# Build: dart run msix:create
msix_config:
  display_name: Flowcharts Editor
  publisher_display_name: OpenIoTHub Cloud
  identity_name: 38916OpenIoTHubCloud.FlowchartsEditor
  publisher: CN=5F64CEA2-463E-41A3-AE89-6979242A61DF
  msix_version: 1.0.1.6
  store: true
  languages: en-us
  capabilities: internetClient
  file_extension: .vsdx, .vsdm, .vstx, .vstm, .vssx, .vssm, .vsd
  logo_path: macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png
  trim_logo: false
