name: visioeditor
description: "Editor for Visio Diagrams — a native, cross-platform Microsoft Visio (.vsdx) editor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Pure-Dart .vsdx engine (model / parser / writer). Local package.
  vsdx:
    path: packages/vsdx

  # Rendering (model -> Flutter Path/Canvas).
  path_drawing: ^1.0.1
  vector_math: ^2.1.4

  # IO / files.
  file_picker: ^8.1.4
  desktop_drop: ^0.4.4
  shared_preferences: ^2.5.3

  # Misc.
  intl: ^0.20.2
  url_launcher: ^6.3.2
  collection: ^1.18.0
  logging: ^1.2.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
